<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Psicogestor 2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            max-width: 450px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: #ffffff;
            padding: 2.5rem;
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3a7bd5;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .brand-logo i {
            color: #00d2ff;
        }
        .btn-psico {
            background-color: #3a7bd5;
            color: white;
            font-weight: 600;
            padding: 0.8rem;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .btn-psico:hover {
            background-color: #2c6dc5;
            color: white;
            transform: translateY(-2px);
        }
        .form-control {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #3a7bd5;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-logo">
            <i class="bi bi-brain"></i> Psicogestor
        </div>
        <p class="text-center text-muted small mb-4">Crea tu cuenta profesional con tu código de invitación exclusivo.</p>

        <form id="registroForm" onsubmit="event.preventDefault(); crearCuenta();">
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Código de Invitación *</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-primary"></i></span>
                    <input type="text" class="form-control border-start-0 text-uppercase fw-bold" id="reg-token" placeholder="Ej. PSICO-XXXX" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Nombre Completo</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="reg-nombre" placeholder="Ej. Juan Pérez" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0" id="reg-email" placeholder="tu@correo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
            </div>

            <div id="alerta-registro" class="alert d-none small p-3 text-center lh-sm" role="alert"></div>

            <button type="submit" class="btn btn-psico w-100 mt-3" id="btn-submit">
                Validar Código y Crear Cuenta
            </button>

            <div class="text-center mt-4 pt-3 border-top" id="seccion-login-link">
                <p class="small text-muted mb-0">¿Ya tienes una cuenta?</p>
                <a href="login.html" class="text-decoration-none fw-bold" style="color: #3a7bd5;">Inicia sesión aquí</a>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://adbklyrecnyryusktftr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkYmtseXJlY255cnl1c2t0ZnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjQ5MTIsImV4cCI6MjA5MDg0MDkxMn0.sK3cbVoRX1PjQx9Me-9PTFXq0wEpWB1JR7EuVby4Gpw';
        const spb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function crearCuenta() {
            const btn = document.getElementById('btn-submit');
            const alerta = document.getElementById('alerta-registro');
            const codigo = document.getElementById('reg-token').value.trim().toUpperCase();
            const nombre = document.getElementById('reg-nombre').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verificando código...';
            btn.disabled = true;
            alerta.classList.add('d-none');
            alerta.classList.remove('alert-danger', 'alert-info');

            try {
                // 1. VERIFICAR EL CÓDIGO (TOKEN) PRIMERO
                const { data: tokenData, error: tokenError } = await spb
                    .from('tokens_registro')
                    .select('*')
                    .eq('token', codigo)
                    .eq('usado', false)
                    .single();

                // Si el token no existe, o ya está usado, tiramos error
                if (tokenError || !tokenData) {
                    throw new Error("El código de invitación es inválido o ya ha sido utilizado.");
                }

                // 2. EL CÓDIGO ES VÁLIDO -> PROCEDEMOS A REGISTRAR
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creando perfil...';
                const { data: authData, error: authError } = await spb.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: nombre
                        }
                    }
                });

                if (authError) throw authError;

                // 3. ÉXITO AL CREAR CUENTA -> QUEMAMOS EL TOKEN PARA QUE NO SE VUELVA A USAR
                if (authData) {
                    await spb.from('tokens_registro').update({ usado: true }).eq('token', codigo);

                    alerta.classList.remove('d-none');
                    alerta.classList.add('alert-info');
                    alerta.innerHTML = '<i class="bi bi-envelope-check-fill fs-4 d-block mb-2 text-primary"></i> ¡Cuenta registrada con éxito!<br>Te hemos enviado un correo de confirmación. <b>Debes confirmarlo antes de poder iniciar sesión.</b>';
                    
                    btn.style.display = 'none'; 
                    document.getElementById('seccion-login-link').style.marginTop = '1rem';
                }

            } catch (error) {
                alerta.classList.remove('d-none');
                alerta.classList.add('alert-danger');
                
                if (error.message.includes('User already registered')) {
                    alerta.innerHTML = 'Este correo ya tiene una cuenta registrada.';
                } else {
                    alerta.innerHTML = '<i class="bi bi-x-circle-fill me-1"></i> ' + error.message;
                }
                
                btn.innerHTML = 'Validar Código y Crear Cuenta';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
