<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicogestor 2.0 - Acceso Seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --psico-primary: #3a7bd5; 
            --psico-secondary: #00d2ff; 
            --text-dark: #2c3e50;
        }

        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .login-card {
            background: white;
            padding: 3.5rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
        }

        .brand-logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--psico-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .brand-logo i {
            font-size: 2rem;
            color: var(--psico-secondary);
        }

        .brand-subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .btn-psico-primary {
            background-color: var(--psico-primary);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-psico-primary:hover {
            background-color: #2c6dc5;
            color: white;
            transform: translateY(-1px);
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
            background-color: #fcfcfc;
        }

        .form-control:focus {
            border-color: var(--psico-primary);
            box-shadow: 0 0 0 0.2rem rgba(58, 123, 213, 0.15);
            background-color: white;
        }

        .form-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f8c8d;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <i class="bi bi-brain"></i> Psicogestor
        </div>
        <div class="brand-subtitle">Portal de Acceso Exclusivo (Beta)</div>

        <form id="loginForm" onsubmit="event.preventDefault(); iniciarSesionCorreo();">
            <div class="mb-4">
                <label class="form-label mb-2">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" required placeholder="doctor@clinica.com">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label mb-2">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-psico-primary w-100 mt-3" id="btn-login">
                Ingresar al Sistema <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-4 small" id="mensaje-error" style="color: #e74c3c; display: none; font-weight: 500; background-color: #fdf0ed; padding: 10px; border-radius: 6px;">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="texto-error">Acceso denegado.</span>
        </div>

        <div class="text-center mt-4 border-top pt-3">
            <p class="small text-muted mb-2">¿Eres psicólogo y aún no tienes cuenta?</p>
            <a href="registro.html" class="btn btn-outline-primary btn-sm fw-bold w-100" style="border-color: var(--psico-primary); color: var(--psico-primary);">Regístrate</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://adbklyrecnyryusktftr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkYmtseXJlY255cnl1c2t0ZnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNjQ5MTIsImV4cCI6MjA5MDg0MDkxMn0.sK3cbVoRX1PjQx9Me-9PTFXq0wEpWB1JR7EuVby4Gpw'; 
        
        const spb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function iniciarSesionCorreo() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const msgError = document.getElementById('mensaje-error');
            const txtError = document.getElementById('texto-error');
            
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verificando...';
            btn.disabled = true;
            msgError.style.display = 'none';

            const { data, error } = await spb.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                // Nuevo manejo de error por si no ha confirmado el correo
                if (error.message.includes('Email not confirmed')) {
                    txtError.innerText = "Por favor confirma tu correo electrónico antes de iniciar sesión.";
                } else {
                    txtError.innerText = "Credenciales incorrectas. Verifica tu correo y contraseña.";
                }
                msgError.style.display = 'block';
                
                btn.innerHTML = 'Ingresar al Sistema <i class="bi bi-arrow-right ms-1"></i>';
                btn.disabled = false;
            } else {
                btn.classList.remove('btn-psico-primary');
                btn.classList.add('btn-success');
                btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i> Acceso Permitido';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            }
        }
    </script>
</body>
</html>
